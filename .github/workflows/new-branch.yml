name: Create New Branch (Custom Source)

on:
  workflow_dispatch:
    inputs:
      confirm_create:
        description: 'Centang untuk mengaktifkan pembuatan branch (Boolean)'
        required: true
        type: boolean
        default: false
      source_branch:
        description: 'Nama branch SUMBER yang mau di-copy (misal: lineage-23.2 atau fastcharge-test)'
        required: false
        type: string
        default: 'lineage-23.2'
      branch_name:
        description: 'Nama branch BARU yang akan dibuat (Empty Field)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validasi Input
        if: inputs.confirm_create == true && inputs.branch_name != ''
        run: |
          # Cek spasi di nama branch baru
          if [[ "${{ inputs.branch_name }}" == *" "* ]]; then
            echo "❌ Error: Nama branch baru tidak boleh mengandung spasi!"
            exit 1
          fi
          # Cek spasi di nama branch sumber
          if [[ "${{ inputs.source_branch }}" == *" "* ]]; then
            echo "❌ Error: Nama branch sumber tidak boleh mengandung spasi!"
            exit 1
          fi
          echo "✅ Input valid. Siap membuat branch '${{ inputs.branch_name }}' dari sumber '${{ inputs.source_branch || 'lineage-23.2' }}'"

      - name: Checkout Source Branch
        if: inputs.confirm_create == true && inputs.branch_name != ''
        uses: actions/checkout@v4
        with:
          # Ambil dari input source_branch, kalau kosong fallback ke lineage-23.2
          ref: ${{ inputs.source_branch || 'lineage-23.2' }}
          fetch-depth: 0

      - name: Konfigurasi Git
        if: inputs.confirm_create == true && inputs.branch_name != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Buat dan Push Branch Baru
        if: inputs.confirm_create == true && inputs.branch_name != ''
        run: |
          SOURCE=${{ inputs.source_branch || 'lineage-23.2' }}
          TARGET=${{ inputs.branch_name }}
          
          echo "🚀 Sedang membuat branch: $TARGET dari base: $SOURCE"
          git checkout -b "$TARGET"
          git push -u origin "$TARGET"
          echo "✅ Sukses! Branch '$TARGET' telah dibuat dari '$SOURCE'"

      - name: Info Pembatalan
        if: inputs.confirm_create == false || inputs.branch_name == ''
        run: |
          echo "⚠️ Pembuatan branch dilewati."
          echo "Pastikan kamu mencentang konfirmasi dan mengisi nama branch baru."
